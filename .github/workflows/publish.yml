# Builds the Quarto site and publishes it on GitHub Pages at every push to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build offline packages (.zip) for each resource
        run: |
          for d in resources/*/; do
            name=$(basename "$d")
            [ "$name" = "_template" ] && continue
            (cd "$d" && zip -qr resource.zip . -x "*.qmd" -x "resource.zip")
          done

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
